name: Release Exam Runtime

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.version.outputs.node-version }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate the release tag
        id: version
        shell: bash
        run: |
          digits='(0|[1-9][0-9]*)'
          stable="^v${digits}\.${digits}\.${digits}$"
          if [[ ! "$GITHUB_REF_NAME" =~ $stable ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The release tag must match the root package.json version.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Tag a commit that is already on main.' >&2
            exit 1
          fi
          archive="dist/npm/exam-runtime-mcp-$version.tgz"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          node_version=$(node -p 'process.versions.node')
          echo "node-version=$node_version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run pack:npm
      - name: Test the packaged MCP server outside the workspace
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: npm run test:npm-package -- "$ARCHIVE"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exam-runtime-npm
          path: ${{ steps.version.outputs.archive }}
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: exam-runtime-npm
          path: dist/npm
      - name: Publish to npm using Trusted Publishing
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/npm/exam-runtime-mcp-$version.tgz"
          state=$(node --input-type=module - "$archive" "$version" <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const [, , archive, version] = process.argv;
          const hash = createHash('sha512').update(readFileSync(archive));
          const local = `sha512-${hash.digest('base64')}`;
          const url = `https://registry.npmjs.org/exam-runtime-mcp/${version}`;
          const signal = AbortSignal.timeout(15_000);
          const response = await fetch(url, { signal });
          if (response.status === 404) {
            console.log('unpublished');
          } else if (!response.ok) {
            throw new Error(`Registry returned HTTP ${response.status}.`);
          } else {
            const { dist } = await response.json();
            if (dist?.integrity !== local) {
              throw new Error('Published tarball differs. Bump the version.');
            }
            console.log('published');
          }
          JS
          )
          if [[ "$state" == unpublished ]]; then
            # GitHub is private, so public provenance cannot be generated.
            npm publish "$archive" --access public --provenance=false
          else
            echo 'npm already has the exact tarball. Skipping publish.'
          fi

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: exam-runtime-npm
          path: dist/npm
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="dist/npm/exam-runtime-mcp-${GITHUB_REF_NAME#v}.tgz"
          export GH_REPO="$GITHUB_REPOSITORY"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Do not overwrite a pre-existing release or its assets.
            existing="$RUNNER_TEMP/released.tgz"
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$(basename "$archive")" --output "$existing"
            cmp "$archive" "$existing"
            echo 'The GitHub release already contains the exact tarball.'
          else
            title="Exam Runtime $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" "$archive" \
              --verify-tag --generate-notes --title "$title"
          fi
